{% extends "base.html" %}
{% block title %}Add Stock Adjustment{% endblock %}
{% block content %}
<div class="max-w-md space-y-6">
  <h1 class="font-display text-2xl text-ink">Add Stock Adjustment</h1>

  <form method="post" class="bg-white border border-line rounded-lg p-6 space-y-4">
    <div class="space-y-1.5">
      <label class="text-sm text-slate">Product</label>
      <select name="product_id" required class="w-full rounded-md border border-line bg-white px-3.5 py-2 text-sm focus:border-amber focus:outline-none focus:ring-1 focus:ring-amber">
        <option value="">Select product…</option>
        {% for p in products %}
        <option value="{{ p.id }}" {{ 'selected' if form.get('product_id') == p.id else '' }}>{{ p.name }} ({{ p.sku }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label class="text-sm text-slate">Direction</label>
        <select name="direction" class="w-full rounded-md border border-line bg-white px-3.5 py-2 text-sm focus:border-amber focus:outline-none focus:ring-1 focus:ring-amber">
          <option value="decrease" {{ 'selected' if form.get('direction','decrease') == 'decrease' else '' }}>Decrease stock</option>
          <option value="increase" {{ 'selected' if form.get('direction') == 'increase' else '' }}>Increase stock</option>
        </select>
      </div>
      <div class="space-y-1.5">
        <label class="text-sm text-slate">Quantity (packs)</label>
        <input type="number" name="quantity" min="1" required value="{{ form.get('quantity','') }}" class="w-full rounded-md border border-line bg-white px-3.5 py-2 text-sm focus:border-amber focus:outline-none focus:ring-1 focus:ring-amber" />
      </div>
    </div>

    <div class="space-y-1.5">
      <label class="text-sm text-slate">Type</label>
      <select name="type" class="w-full rounded-md border border-line bg-white px-3.5 py-2 text-sm focus:border-amber focus:outline-none focus:ring-1 focus:ring-amber">
        {% for t in types %}
        <option value="{{ t }}" {{ 'selected' if form.get('type') == t else '' }}>{{ type_labels[t] }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="space-y-1.5">
      <label class="text-sm text-slate">Reason</label>
      <input name="reason" required value="{{ form.get('reason','') }}" placeholder="e.g. Water damage during storage" class="w-full rounded-md border border-line bg-white px-3.5 py-2 text-sm focus:border-amber focus:outline-none focus:ring-1 focus:ring-amber" />
    </div>

    <div class="space-y-1.5">
      <label class="text-sm text-slate">Date</label>
      <input type="date" name="date" required id="date-input" value="{{ form.get('date') or '' }}" class="w-full rounded-md border border-line bg-white px-3.5 py-2 text-sm focus:border-amber focus:outline-none focus:ring-1 focus:ring-amber" />
    </div>

    <div class="space-y-1.5">
      <label class="text-sm text-slate">Notes</label>
      <input name="notes" value="{{ form.get('notes','') }}" class="w-full rounded-md border border-line bg-white px-3.5 py-2 text-sm focus:border-amber focus:outline-none focus:ring-1 focus:ring-amber" />
    </div>

    {% if errors %}
    <div class="rounded-md border border-rust/30 bg-rust/5 px-3.5 py-2.5 text-sm text-rust space-y-0.5">
      {% for e in errors %}<div>{{ e }}</div>{% endfor %}
    </div>
    {% endif %}

    <div class="flex justify-end gap-2 pt-2">
      <a href="{{ url_for('stock_adjustments.list_adjustments') }}" class="rounded-md px-4 py-2 text-sm font-medium border border-line text-ink hover:bg-paper2 transition-colors">Cancel</a>
      <button type="submit" class="rounded-md px-4 py-2 text-sm font-medium bg-ink text-paper hover:bg-ink2 transition-colors">Save adjustment</button>
    </div>
  </form>
</div>
<script>
  const di = document.getElementById('date-input');
  di.max = new Date().toISOString().slice(0,10);
  if (!di.value) di.value = new Date().toISOString().slice(0,10);
</script>
{% endblock %}
